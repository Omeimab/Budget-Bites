<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Bites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fc; }
    .tab-button.active { background-color: #10b981; color: white; box-shadow: 0 4px 10px -2px rgba(16, 185, 129, 0.4); transform: translateY(-2px); }
    .tab-button { transition: all 0.2s; border-bottom: 3px solid transparent; cursor: pointer; }
    .card { background-color: white; border-radius: 16px; box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.1); padding: 1.5rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-extrabold text-gray-800">Budget Bites 🍽️</h1>
      <p class="text-gray-500 mt-1">Smart Kitchen Manager</p>
    </header>

    <nav class="flex justify-center mb-10 bg-white p-2 rounded-full shadow-lg max-w-fit mx-auto">
      <button id="nav-inventory" class="tab-button active px-6 py-2 mx-1 text-sm font-bold rounded-full">Inventory</button>
      <button id="nav-shopping" class="tab-button px-6 py-2 mx-1 text-sm font-bold rounded-full">Shopping</button>
    </nav>

    <main id="content-area">
        </main>
  </div>

  <div id="modal-container" class="fixed inset-0 bg-gray-900/75 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <h3 id="modal-title" class="text-2xl font-bold mb-6 text-gray-800">Add Item</h3>
      <form id="item-form" class="space-y-4">
        <input type="hidden" id="list-type">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Name</label>
          <input type="text" id="item-name" required class="w-full rounded-xl border-gray-200 p-3 border outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="flex space-x-4">
          <div class="flex-1">
            <label class="block text-sm font-bold text-gray-700 mb-1">Qty</label>
            <input type="number" id="item-quantity" required min="1" value="1" class="w-full rounded-xl border-gray-200 p-3 border outline-none">
          </div>
          <div class="flex-1">
            <label class="block text-sm font-bold text-gray-700 mb-1">Unit</label>
            <input type="text" id="item-unit" placeholder="pcs" class="w-full rounded-xl border-gray-200 p-3 border outline-none">
          </div>
        </div>
        <div id="expiry-field" class="pt-4 border-t border-dashed">
          <label class="block text-xs font-black text-emerald-600 uppercase mb-2">Shelf Life (Days)</label>
          <input type="number" id="item-shelf-life" placeholder="e.g. 7" class="w-full rounded-xl border-emerald-100 bg-emerald-50 p-3 border outline-none">
        </div>
        <div class="flex justify-end space-x-3 pt-6">
          <button type="button" id="btn-cancel" class="px-6 py-2 font-bold text-gray-700 bg-gray-100 rounded-xl">Cancel</button>
          <button type="submit" class="px-6 py-2 font-bold text-white bg-emerald-500 rounded-xl">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // App State
    let inventory = JSON.parse(localStorage.getItem('bb_inventory')) || [];
    let shoppingList = JSON.parse(localStorage.getItem('bb_shopping')) || [];
    let activeTab = 'inventory';

    // Core Drawing Function (Fixed Syntax)
    function draw() {
      const root = document.getElementById("content-area");
      
      if (activeTab === 'inventory') {
        let listHtml = inventory.map((item, index) => `
          <div class="flex justify-between p-4 border rounded-xl items-center bg-white mb-2">
            <div>
              <p class="font-bold text-gray-800">${item.name}</p>
              <p class="text-[10px] text-gray-400 font-bold uppercase">${item.quantity} ${item.unit} • Exp: ${item.expiry}</p>
            </div>
            <button onclick="removeItem('inventory', ${index})" class="text-red-400 px-2 font-black">✕</button>
          </div>
        `).join('');

        root.innerHTML = `
          <div class="card">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-2xl font-bold text-gray-800">My Kitchen</h2>
              <button onclick="openModal('inventory')" class="bg-emerald-500 text-white px-6 py-2 rounded-full font-bold shadow-md">+ Add</button>
            </div>
            ${listHtml || '<p class="text-center italic text-gray-400 py-10">Kitchen is empty.</p>'}
          </div>`;
      } else {
        let listHtml = shoppingList.map((item, index) => `
          <div class="flex justify-between p-4 border rounded-xl items-center bg-emerald-50/20 border-emerald-100 mb-2">
            <div>
              <p class="font-bold text-gray-800">${item.name}</p>
              <p class="text-[10px] text-emerald-600 font-bold uppercase">Needs Buying</p>
            </div>
            <div class="flex gap-2">
                <button onclick="moveToInventory(${index})" class="bg-emerald-500 text-white px-3 py-1 rounded-lg text-[10px] font-black uppercase">Bought</button>
                <button onclick="removeItem('shopping', ${index})" class="text-gray-300 px-2 font-black">✕</button>
            </div>
          </div>
        `).join('');

        root.innerHTML = `
          <div class="card">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Shopping List</h2>
            <button onclick="openModal('shopping')" class="bg-emerald-500 text-white px-4 py-2 rounded-full font-bold mb-4 w-full">+ Add Item</button>
            ${listHtml || '<p class="text-center italic text-gray-400 py-10">Nothing to buy.</p>'}
          </div>`;
      }
    }

    // Modal Helpers
    window.openModal = (type) => {
      document.getElementById('list-type').value = type;
      document.getElementById('modal-container').classList.remove('hidden');
      document.getElementById('modal-container').classList.add('flex');
    };

    document.getElementById('btn-cancel').onclick = () => {
      document.getElementById('modal-container').classList.add('hidden');
    };

    // Form Handling
    document.getElementById('item-form').onsubmit = (e) => {
      e.preventDefault();
      const type = document.getElementById('list-type').value;
      const shelfLife = parseInt(document.getElementById('item-shelf-life').value) || 0;
      
      let expDate = "No Date";
      if(shelfLife > 0) {
        const d = new Date();
        d.setDate(d.getDate() + shelfLife);
        expDate = d.toISOString().split('T')[0];
      }

      const item = {
        name: document.getElementById('item-name').value,
        quantity: document.getElementById('item-quantity').value,
        unit: document.getElementById('item-unit').value,
        expiry: expDate
      };

      if(type === 'inventory') inventory.push(item);
      else shoppingList.push(item);

      save();
      document.getElementById('modal-container').classList.add('hidden');
      document.getElementById('item-form').reset();
      draw();
    };

    window.removeItem = (type, index) => {
        if(type === 'inventory') inventory.splice(index, 1);
        else shoppingList.splice(index, 1);
        save();
        draw();
    };

    window.moveToInventory = (index) => {
        const item = shoppingList.splice(index, 1)[0];
        inventory.push(item);
        save();
        draw();
    };

    function save() {
      localStorage.setItem('bb_inventory', JSON.stringify(inventory));
      localStorage.setItem('bb_shopping', JSON.stringify(shoppingList));
    }

    // Tab Navigation
    document.getElementById('nav-inventory').onclick = () => {
      activeTab = 'inventory';
      document.getElementById('nav-inventory').classList.add('active');
      document.getElementById('nav-shopping').classList.remove('active');
      draw();
    };

    document.getElementById('nav-shopping').onclick = () => {
      activeTab = 'shopping';
      document.getElementById('nav-shopping').classList.add('active');
      document.getElementById('nav-inventory').classList.remove('active');
      draw();
    };

    // Initial Start
    draw();
  </script>
</body>
</html>
